# The same extension defined at BOTH the legacy top-level key and the
# namespaced key. This is a validation error, not a silent precedence win.
service: dup-keys

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  stage: dev

functions:
  ingest:
    handler: handler.ingest

alarms:
  groups:
    lambda:
      metrics:
        - name: Errors
          threshold: 5
          comparisonOperator: GreaterThanThreshold

custom:
  slsTf:
    alarms:
      groups:
        lambda:
          metrics:
            - name: Throttles
              threshold: 1
              comparisonOperator: GreaterThanThreshold
