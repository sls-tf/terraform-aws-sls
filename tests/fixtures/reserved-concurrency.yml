service: reserved-concurrency-test

provider:
  name: aws
  runtime: nodejs18.x
  region: us-west-2
  stage: dev

functions:
  capped:
    handler: handler.capped
    reservedConcurrency: 3
  disabled:
    handler: handler.disabled
    reservedConcurrency: 0
  uncapped:
    handler: handler.uncapped
