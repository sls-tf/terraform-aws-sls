service: cw-observability

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  stage: dev

functions:
  worker:
    handler: handler.work

resources:
  Resources:
    AlertsTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: service-alerts-dev

    PagerDutySubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn:
          Ref: AlertsTopic
        Protocol: https
        Endpoint: https://events.pagerduty.com/integration/abc123/enqueue

    ExternalTopicSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: arn:aws:sns:us-east-1:123456789012:external-alerts
        Protocol: email
        Endpoint: oncall@example.com
        FilterPolicy:
          severity:
            - critical

    ServiceDashboard:
      Type: AWS::CloudWatch::Dashboard
      Properties:
        DashboardName: event-service-dev
        DashboardBody:
          widgets:
            - type: metric
              properties:
                metrics:
                  - ["AWS/Lambda", "Errors", "FunctionName", "worker"]
                period: 300
                stat: Sum

    WorkerErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: worker-errors-dev
        AlarmDescription: Worker lambda errors
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value:
              Ref: worker
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 2
        DatapointsToAlarm: 2
        Threshold: 5
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - Ref: AlertsTopic
        OKActions:
          - arn:aws:sns:us-east-1:123456789012:external-alerts
