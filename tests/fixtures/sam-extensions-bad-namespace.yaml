AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Misspelled extension namespace — everything under it is ignored

Metadata:
  Slstf:                        # should be SlsTf
    Alarms:
      groups:
        lambda:
          metrics:
            - name: Errors
              threshold: 1
              comparisonOperator: GreaterThanThreshold

Globals:
  Function:
    Runtime: nodejs20.x

Resources:
  Ingest:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: badns-dev-ingest
      Handler: handler.ingest
